<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk · DevFest Istanbul Speakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="data.js"></script>
<script src="ui.js"></script>
<script>
const { D, esc, I, initials, shell, store, save, summary, plural, statusPill, speakerName, roleLine, otherTalks, readQuery, writeQuery, filtered } = UI;
const params = new URLSearchParams(location.search);
const f = readQuery();
const q = writeQuery(f);
const showAll = store.get(D.showAllKey, false);
const admin = D.me.role === 'admin';
const talk = D.talks.find((x) => x.id === params.get('id')) ?? D.talks[0];
document.title = `${talk.title} · DevFest Istanbul Speakers`;

// Stepping order: snapshot at load, filtered like the list, then limited to the chosen status.
const order = filtered({ ...f, status: 'all' }, showAll, true).filter((x) => f.status === 'all' || x.status === f.status);
const at = order.findIndex((x) => x.id === talk.id);
const prev = at > 0 ? order[at - 1] : null;
const next = at >= 0 && at < order.length - 1 ? order[at + 1] : null;
const link = (x, extra = q) => `talk.html?id=${x.id}${extra ? '&' + extra : ''}`;
const listHref = `index.html${q ? '?' + q : ''}`;

const sp = talk.speaker;
const others = otherTalks(talk);
const from = sp.abroad ? `${sp.abroad}, travelling from abroad` : sp.outside ? `${sp.outside}, outside Istanbul` : sp.from;
const consents = Object.values(sp.consent);
const consent = consents.every((v) => v) ? 'All three given (conduct, recording, personal data)' : consents.some((v) => v) ? 'Partly answered' : 'Not answered (older form version)';
const linkRows = [['linkedin', 'LinkedIn'], ['x', 'X'], ['github', 'GitHub'], ['instagram', 'Instagram']].filter(([k]) => sp.links[k]);

const approved = D.talks.filter((x) => !x.removed && x.status === 'approved');
const tally = (k) => Object.entries(approved.reduce((m, x) => ({ ...m, [x[k]]: (m[x[k]] ?? 0) + 1 }), {})).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
const topicTally = tally('topic');
const maxTopic = Math.max(1, ...topicTally.map(([, n]) => n));

const simLabel = (s) => (s >= 0.92 ? 'Very similar' : 'Similar');
const simWidth = (s) => Math.round(Math.min(1, Math.max(0, (s - 0.82) / (0.95 - 0.82))) * 100);

shell('list', `
  <div class="stepper">
    <a class="crumb" href="${listHref}">${I.left}Submissions</a>
    <span class="muted">·</span>
    <span class="select"><select id="scope" aria-label="Step through">${['all', ...D.STATUSES].map((s) => `<option value="${s}"${f.status === s ? ' selected' : ''}>${s === 'all' ? 'All talks' : D.LABEL[s] + ' only'}</option>`).join('')}</select></span>
    <span class="muted num">${at >= 0 ? `${at + 1} of ${order.length}` : `Not in ${D.LABEL[f.status].toLowerCase()} · ${order.length} there`}</span>
    <span class="grow"></span>
    <span class="muted step-hint" style="font-size:13px"><span class="kbd">←</span> <span class="kbd">→</span> to step · <span class="kbd">P</span> projector</span>
    <button class="btn sm" id="proj">${I.screen}<span></span></button>
    <a class="btn sm" ${prev ? `href="${link(prev)}"` : 'aria-disabled="true" style="color:var(--faint);pointer-events:none"'}>${I.left}Previous</a>
    <a class="btn sm" ${next ? `href="${link(next)}"` : 'aria-disabled="true" style="color:var(--faint);pointer-events:none"'}>Next${I.right}</a>
  </div>

  <div class="mini-anchor"><div class="card mini" id="mini" aria-label="Score and decision">
    <span class="mini-title">${esc(talk.title)}</span>
    <div class="seg score" role="group" aria-label="Your score" data-slot="score"></div>
    <div data-slot="decision"></div>
  </div></div>
  <div class="object-wrap"><section class="card object" id="object" aria-label="Talk">
    <div class="portrait" aria-hidden="true">${initials(speakerName(sp))}</div>
    <div style="min-width:0">
      <h1>${esc(talk.title)}</h1>
      <p class="meta"><span class="who">${esc(speakerName(sp))}</span><span>${esc(roleLine(sp))}</span><span class="sep">·</span><span>${esc(talk.topic)}</span><span class="sep">·</span><span>${esc(talk.level)}</span><span class="sep">·</span><span>${esc(talk.language)}</span>${talk.sources.includes('advocu') ? '<span class="tag">Form + Advocu</span>' : ''}${talk.removed ? '<span class="tag">Removed from sheet</span>' : ''}</p>
    </div>
    <div class="verdict">
      <div><div class="control-label" id="score-label">Your score</div>
        <div class="seg score" role="group" aria-labelledby="score-label" data-slot="score"></div>
        <div class="control-note" id="score-note"></div></div>
      <div><div class="control-label" id="decision-label">Decision</div>
        <div data-slot="decision"></div>
        <div class="control-note" id="decision-note"></div></div>
    </div>
  </section></div>

  <div class="talk-grid">
    <div class="stack">
      <section class="card pad">
        <div class="section"><h3>Abstract</h3><p class="prose">${esc(talk.abstract)}</p></div>
        <div class="section"><h3>Key takeaways</h3><ul class="takeaways">${talk.takeaways.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
        <div class="section"><h3>Presented before</h3><p class="prose">${talk.presentedBefore === 'Yes' ? esc(talk.talkHistory || 'Yes') : 'No'}</p></div>
        ${talk.coSpeaker ? `<div class="section"><h3>Co-speaker</h3>
          <p class="prose"><b style="font-weight:500">${esc(talk.coSpeaker.first + ' ' + talk.coSpeaker.last)}</b> · ${esc(talk.coSpeaker.bio)}</p>
          <ul class="contact" style="margin-top:4px">
            <li>${I.mail}<a href="mailto:${esc(talk.coSpeaker.email)}">${esc(talk.coSpeaker.email)}</a><button class="copy" data-copy="${esc(talk.coSpeaker.email)}">Copy</button></li>
            <li>${I.phone}<a href="tel:${esc(talk.coSpeaker.phone.replace(/\s/g, ''))}">${esc(talk.coSpeaker.phone)}</a><button class="copy" data-copy="${esc(talk.coSpeaker.phone)}">Copy</button></li>
          </ul></div>` : ''}
      </section>

      <section class="card pad" aria-label="Gemini overview">
        <div class="card-head"><h2>Gemini overview</h2><span class="ai-note">Based only on what the speaker wrote${admin ? ' · <button class="link-btn">Regenerate</button>' : ''}</span></div>
        ${talk.ai ? `<p class="prose" style="font-size:15px;line-height:24px">${esc(talk.ai.talk)} ${esc(talk.ai.speaker)}</p>
          <dl class="flags">${talk.ai.flags.map(([k, v, why]) => `<dt>${esc(k)}</dt><dd><b>${esc(v)}</b><span>${esc(why)}</span></dd>`).join('')}</dl>`
          : '<p class="muted">Overview not ready yet. It appears a few minutes after a talk syncs.</p>'}
      </section>

      <section class="card pad" aria-label="Comments">
        <div class="card-head"><h2>Comments <span class="muted num" id="ccount">${talk.comments.length}</span></h2></div>
        <ul id="comments"></ul>
        <form class="composer" id="composer" style="margin-top:12px">
          <label class="vh" for="ctext">Add a comment</label>
          <textarea id="ctext" placeholder="Add a comment"></textarea>
          <div class="row-end"><span class="muted" style="font-size:12px">Ctrl or ⌘ + Enter to post</span><button class="btn primary sm" type="submit">Post comment</button></div>
        </form>
      </section>
    </div>

    <div class="stack">
      <section class="card pad" aria-label="Speaker">
        <div class="speaker-head"><div class="portrait" aria-hidden="true">${initials(speakerName(sp))}</div>
          <div><b>${esc(speakerName(sp))}</b><span class="muted">${esc(roleLine(sp))}</span></div></div>
        <ul class="contact ruled">
          <li>${I.mail}<a href="mailto:${esc(sp.email)}">${esc(sp.email)}</a><button class="copy" data-copy="${esc(sp.email)}">Copy</button></li>
          <li>${I.phone}<a href="tel:${esc(sp.phone.replace(/\s/g, ''))}">${esc(sp.phone)}</a><button class="copy" data-copy="${esc(sp.phone)}">Copy</button></li>
          ${linkRows.map(([k, label]) => `<li>${I.link}<a href="https://${esc(sp.links[k])}" target="_blank" rel="noopener noreferrer">${label} <span class="muted">${esc(sp.links[k].replace(/^[^/]+\//, ''))}</span></a><span></span></li>`).join('')}
        </ul>
        <dl class="kv" style="margin:16px 0">
          <dt>GDE</dt><dd>${esc(sp.gde)}</dd>
          <dt>Coming from</dt><dd>${esc(from)}</dd>
          <dt>Consent</dt><dd>${esc(consent)}</dd>
        </dl>
        <details class="more"><summary>Bio</summary><p>${esc(sp.bio)}</p></details>
        <details class="more" open><summary>Speaking experience</summary><p>${esc(sp.experience)}</p></details>
        <details class="more"><summary>Why DevFest Istanbul</summary><p>${esc(sp.why)}</p></details>
        ${sp.anything ? `<details class="more"><summary>Anything else</summary><p>${esc(sp.anything)}</p></details>` : ''}
      </section>

      ${others.length ? `<section class="card pad" aria-label="Also submitted">
        <div class="card-head"><h2>Also submitted by ${esc(sp.first)}</h2></div>
        <ul class="mini-list">${others.map((o) => `<li><div class="grow"><a href="${link(o)}">${esc(o.title)}</a><div class="cell-sub">${esc(o.topic)} · ${esc(o.level)}</div></div>${statusPill(o.status)}</li>`).join('')}</ul>
      </section>` : ''}

      <section class="card pad" aria-label="Similar talks">
        <div class="card-head"><h2>Similar talks</h2></div>
        ${talk.similar.length ? `<ul class="mini-list">${talk.similar.map(([id, s]) => { const o = D.talks.find((x) => x.id === id); return `<li><div class="grow"><a href="${link(o)}">${esc(o.title)}</a><div class="cell-sub">${esc(speakerName(o.speaker))} · ${simLabel(s)}</div></div>${statusPill(o.status)}</li>`; }).join('')}</ul>`
          : '<p class="muted">No close matches among the other talks.</p>'}
      </section>

      <section class="card pad" aria-label="Approved so far">
        <div class="card-head"><h2>Approved so far</h2><span class="muted num">${plural(approved.length, 'talk')}</span></div>
        <ul class="bars">${topicTally.map(([k, n]) => `<li><span>${esc(k)}</span><span class="num">${n}</span><span class="bar"><i style="width:${(n / maxTopic) * 100}%"></i></span></li>`).join('')}</ul>
        <dl class="kv" style="margin-top:12px">
          <dt>Language</dt><dd>${tally('language').map(([k, n]) => `${esc(k)} ${n}`).join(' · ')}</dd>
          <dt>Level</dt><dd>${tally('level').map(([k, n]) => `${esc(k)} ${n}`).join(' · ')}</dd>
        </dl>
      </section>
    </div>
  </div>
`);

function renderVerdict() {
  const s = summary(talk, showAll);
  const scoreHtml = [1, 2, 3, 4, 5].map((v) => `<button aria-pressed="${s.mine === v}" data-score="${v}">${v}</button>`).join('');
  const who = s.entries.map((e) => `${esc(e.name.split(' ')[0])} ${e.value}`).join(', ');
  document.getElementById('score-note').innerHTML = s.revealed
    ? `<span title="${who}">Team <b class="num" style="color:var(--text);font-weight:600">${s.avg}</b> · ${s.min === s.max ? s.min : `${s.min}–${s.max}`} · ${plural(s.count, 'score')}</span>${s.mine !== null ? ' · <button class="link-btn" id="clear-score" style="font-size:12px">Clear</button>' : ''}`
    : s.count ? `${plural(s.count, 'score')} so far · score to see them` : 'Nobody has scored yet';

  const last = talk.history[talk.history.length - 1];
  const decided = last ? `by ${esc(last[1])} · ${esc(last[2])}` : 'since it was submitted';
  for (const el of document.querySelectorAll('[data-slot="score"]')) el.innerHTML = scoreHtml;
  const decisionHtml = admin
    ? `<div class="seg decide" role="group" aria-labelledby="decision-label">${['approved', 'maybe', 'declined'].map((st) => `<button class="st-${st}" aria-pressed="${talk.status === st}" data-status="${st}"><span class="dot"></span>${{ approved: 'Approve', maybe: 'Maybe', declined: 'Decline' }[st]}</button>`).join('')}</div>`
    : statusPill(talk.status);
  for (const el of document.querySelectorAll('[data-slot="decision"]')) el.innerHTML = decisionHtml;
  document.getElementById('decision-note').innerHTML = `${admin ? statusPill(talk.status) + ' ' : ''}${decided}${admin && talk.status !== 'pending' ? ' · <button class="link-btn" id="reset" style="font-size:12px">Reset to pending</button>' : ''}`;
}

function renderComments() {
  document.getElementById('ccount').textContent = talk.comments.length;
  document.getElementById('comments').innerHTML = talk.comments.length
    ? talk.comments.map((c) => `<li class="comment"><div class="comment-head"><span class="avatar sm">${initials(c.by)}</span><b>${esc(c.by)}</b><span class="muted" style="font-size:13px">${esc(c.when)}</span></div><p>${esc(c.text)}</p></li>`).join('')
    : '<li class="muted">No comments yet.</li>';
}

function decide(status) {
  talk.status = status;
  talk.history = talk.history.concat([[status, D.me.name, 'just now']]);
  save(talk.id, { status });
  renderVerdict();
}

document.addEventListener('click', (e) => {
  const sb = e.target.closest('[data-score]');
  if (sb) { const v = Number(sb.dataset.score); if (talk.scores[D.me.uid] === v) delete talk.scores[D.me.uid]; else talk.scores[D.me.uid] = v; save(talk.id, { mine: talk.scores[D.me.uid] ?? null }); return renderVerdict(); }
  if (e.target.id === 'clear-score') { delete talk.scores[D.me.uid]; save(talk.id, { mine: null }); return renderVerdict(); }
  const db = e.target.closest('[data-status]');
  if (db) return decide(talk.status === db.dataset.status ? 'pending' : db.dataset.status);
  if (e.target.id === 'reset') return decide('pending');
  const cp = e.target.closest('[data-copy]');
  if (cp) { try { navigator.clipboard.writeText(cp.dataset.copy); } catch { /* no clipboard in this context */ } cp.textContent = 'Copied'; setTimeout(() => { cp.textContent = 'Copy'; }, 1200); }
});
document.getElementById('scope').addEventListener('change', (e) => { location.href = link(talk, writeQuery({ ...f, status: e.target.value })); });
const post = () => {
  const ta = document.getElementById('ctext');
  const text = ta.value.trim();
  if (!text) return;
  const c = { by: D.me.name, when: 'just now', text };
  talk.comments = talk.comments.concat([c]);
  const all = store.get('mock.overrides', {});
  save(talk.id, { comments: (all[talk.id]?.comments ?? []).concat([c]) });
  ta.value = '';
  renderComments();
};
document.getElementById('composer').addEventListener('submit', (e) => { e.preventDefault(); post(); });
document.getElementById('ctext').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); post(); } });
function setProjector(on) {
  document.documentElement.classList.toggle('projector', on);
  store.set('mock.projector', on);
  const b = document.getElementById('proj');
  b.setAttribute('aria-pressed', String(on));
  b.lastChild.textContent = on ? 'Exit projector view' : 'Projector view';
}
setProjector(document.documentElement.classList.contains('projector'));
document.getElementById('proj').addEventListener('click', () => setProjector(!document.documentElement.classList.contains('projector')));
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  if (e.key === 'p' || e.key === 'P') setProjector(!document.documentElement.classList.contains('projector'));
  if (e.key === 'ArrowLeft' && prev) location.href = link(prev);
  if (e.key === 'ArrowRight' && next) location.href = link(next);
});
renderVerdict();
renderComments();
// Condense the header once it sticks: title, score and decision only.
// Show the compact bar once the full header has scrolled under it. The bar takes no layout space, so showing it
// never moves the page (a header that shrank in place made scroll anchoring pull the page back up).
new IntersectionObserver(([e]) => document.getElementById('mini').classList.toggle('show', !e.isIntersecting), { rootMargin: '-72px 0px 0px 0px' }).observe(document.getElementById('object'));
</script>
</body>
</html>
