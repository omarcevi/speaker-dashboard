<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · DevFest Istanbul Speakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="solo" id="root"></main>
<script>
// ?waiting shows the screen a signed-in but unapproved person sees.
const waiting = new URLSearchParams(location.search).has('waiting');
const email = 'ece.karaca@example.com'; // taste-skill-ignore: RFC 2606 reserved domain, so no real address is fabricated
const dots = '<span class="dots" aria-hidden="true"><i style="background:var(--pend)"></i><i style="background:var(--no)"></i><i style="background:var(--maybe)"></i><i style="background:var(--ok)"></i></span>';
document.getElementById('root').innerHTML = `<div class="card">
  <div class="mark" style="padding:0">${dots}<span><b>DevFest Istanbul</b><span>Speakers 2026</span></span></div>
  ${waiting
    ? `<h1>Thanks, you're signed in</h1><p>An admin needs to approve your access before you can see submissions. Ask one of the organizers if it takes long.</p>
       <p>Signed in as ${email}</p><a class="btn google-btn" href="signin.html">Sign out</a>`
    : `<h1>Sign in to review talks</h1><p>For the DevFest Istanbul organizing team. New people get access once an admin approves them.</p>
       <a class="btn primary google-btn" href="index.html">Sign in with Google</a>`}
</div>`;
</script>
</body>
</html>
